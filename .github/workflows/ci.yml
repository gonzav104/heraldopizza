name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run. A running main build is never cancelled, but GitHub keeps only
# one pending run per group, so a burst of merges to main may skip verifying the intermediate commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The public menu's initial chunk carries no supabase-js or admin sign-in, and no file holds a server-only key.
      - name: Bundle check
        run: npm run check:bundle

  database:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Local stack on the runner: applies the migrations and the seed. No remote project and no secrets are involved.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: pgTAP tests
        run: npm run db:test

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
