name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run. A running main build is never cancelled, but GitHub keeps only
# one pending run per group, so a burst of merges to main may skip verifying the intermediate commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The public menu's initial chunk carries no supabase-js or admin sign-in, and no file holds a server-only key.
      # The real WhatsApp link stays off in every build until the owner authorizes it (P6b-2): a build whose environment
      # sets VITE_WHATSAPP_ENABLED=true fails here. Turning it on is a separate, explicit change of this assertion.
      - name: Bundle check
        run: npm run check:bundle -- --whatsapp=apagado

  database:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Local stack on the runner: applies the migrations and the seed. No remote project and no secrets are involved.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: pgTAP tests
        run: npm run db:test

      # The read-only deployment verification (supabase/verificar_despliegue.sql) on the freshly seeded stack: migrations,
      # RLS, permissions, functions, and the authorized initial data. If a migration, a permission, or the seed changes,
      # that file changes in the same pull request (P6b-2).
      - name: Deployment verification (read-only SQL)
        run: npm run db:verify

      # Public sign-up stays closed and password sign-in stays enabled on the local stack (RF-27, RF-28).
      - name: Auth settings
        run: npm run db:check-auth

      # What a visitor sees through the public API, with GET requests only: sign-up closed, the initial data, the same
      # promotions, no access to the administrators, and the private schema not exposed (P6b-2).
      - name: Public API verification (GET only)
        run: npm run api:verify

      # Admin edits in /admin reach Supabase and the public menu (U5). Resets the runner's local database first.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
